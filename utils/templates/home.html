<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVoid - Home</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">

    <!-- Google Font for the gaming theme -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons for the gaming icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <style>
        /* Base Styles (Dark Mode by default) */
        body {
            background-color: #1e1e2f;
            color: white;
            font-family: 'Press Start 2P', cursive;
            transition: background-color 0.5s, color 0.5s;
        }

        /* Navbar */
        .navbar {
            background-color: #0d1117;
            border-bottom: 3px solid #0088ff;
        }

        .navbar-brand, .nav-link {
            color: #0088ff !important;
        }

        .navbar-nav .nav-link:hover {
            color: #00ff99 !important;
        }

        /* Container background */
        .container {
            background-color: #2b2b3d;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
            margin-top: 30px;
        }

        h1 {
            color: #00ff99;
        }

        /* Button with neon glow effect */
        .btn-primary {
            background-color: #0088ff;
            border-color: #0088ff;
            color: white;
            box-shadow: 0 0 10px #00ff99, 0 0 20px #0088ff;
            transition: box-shadow 0.3s ease-in-out, background-color 0.3s ease-in-out;
        }

        .btn-primary:hover {
            background-color: #00ff99;
            border-color: #00ff99;
            box-shadow: 0 0 20px #00ff99, 0 0 30px #0088ff;
        }

        /* Links with hover effects */
        a {
            color: #00ff99;
        }

        a:hover {
            color: #0088ff;
        }

        small {
            color: #ccc;
        }

        /* Light Mode */
        body.light-mode {
            background-color: #f0f0f5;
            color: #000;
        }

        .light-mode .navbar {
            background-color: #e2e2e2;
            border-bottom: 3px solid #007bff;
        }

        .light-mode .container {
            background-color: #ffffff;
            color: #000;
        }

        .light-mode .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .light-mode a {
            color: #007bff;
        }

        .light-mode a:hover {
            color: rgb(3, 3, 93);
        }

        /* Footer */
        .footer {
            background-color: #0d1117;
            padding: 10px 0;
            text-align: center;
            color: #ccc;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .footer a {
            color: #00ff99;
            margin: 0 10px;
        }

        .footer a:hover {
            color: #0088ff;
        }

        /* Popular Games Stats */
        .stats-section {
            margin-top: 40px;
            text-align: center;
            color: #00ff99;
        }

        .stats-section ul {
            list-style: none;
            padding: 0;
        }

        .stats-section li {
            padding: 10px;
            font-size: 18px;
        }

    </style>

</head>

<body>
    <!-- The Navigation bar -->
    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand" href="#">
            <i class="fas fa-gamepad"></i> GameVoid
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="/home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/games">Games</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/bets">Bets</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/profile">Profile</a>
                </li>
                <li class="nav-item">
                    <button type="button" id="toggleTheme" class="btn btn-primary">
                        <i class="fas fa-sun theme-icon" id="themeIcon"></i>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Introduction Section -->
    <div class="container text-center">
        <h1>Welcome to GameVoid!</h1>
        <p>The ultimate gaming hub where players and gamers unite!</p>
    </div>

    <!-- Popular Games Stats -->
    <div class="stats-section">
        <h2>Popular Games</h2>
        <ul>
            <li>Game 1 - 500,000 players</li>
            <li>Game 2 - 300,000 players</li>
            <li>Game 3 - 200,000 players</li>
        </ul>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>Follow us on:
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-twitch"></i></a>
        </p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>
    <script>
        // Toggle light and dark mode
        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            body.classList.toggle('light-mode');
            themeIcon.classList.toggle('fa-moon');
            themeIcon.classList.toggle('fa-sun');
        }

        document.getElementById('toggleTheme').addEventListener('click', toggleTheme);
    </script>
</body>

</html>
